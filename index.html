<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>의견 수렴 집계기</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
    select, button { padding: 0.4rem 0.6rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; }
    th { background: #f5f5f5; }
  </style>
</head>
<body>
  <h1>3분류 의견 수렴 집계</h1>

  <div class="row">
    <label for="category">분류</label>
    <select id="category">
      <option value="분류1">분류1</option>
      <option value="분류2">분류2</option>
      <option value="분류3">분류3</option>
    </select>

    <label for="opinion">의견</label>
    <select id="opinion">
      <option value="찬성">찬성</option>
      <option value="반대">반대</option>
    </select>

    <button id="addVote" type="button">의견 추가</button>
    <button id="downloadCsv" type="button">CSV 다운로드</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>분류</th>
        <th>찬성</th>
        <th>반대</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>

  <script>
    const categories = ["분류1", "분류2", "분류3"];
    const counts = categories.reduce((acc, name) => {
      acc[name] = { "찬성": 0, "반대": 0 };
      return acc;
    }, {});

    function renderTable() {
      const body = document.getElementById("resultBody");
      body.innerHTML = "";

      categories.forEach((category) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${category}</td>
          <td>${counts[category]["찬성"]}</td>
          <td>${counts[category]["반대"]}</td>
        `;
        body.appendChild(row);
      });
    }

    function toCsv() {
      const lines = ["분류,찬성,반대"];
      categories.forEach((category) => {
        const agree = counts[category]["찬성"];
        const disagree = counts[category]["반대"];
        lines.push(`${category},${agree},${disagree}`);
      });
      return lines.join("\n");
    }

    document.getElementById("addVote").addEventListener("click", () => {
      const category = document.getElementById("category").value;
      const opinion = document.getElementById("opinion").value;
      counts[category][opinion] += 1;
      renderTable();
    });

    document.getElementById("downloadCsv").addEventListener("click", () => {
      const csvContent = toCsv();
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "opinion_summary.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    });

    renderTable();
  </script>
</body>
</html>
