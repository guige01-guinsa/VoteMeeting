<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoteMeeting 다운로드</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.5; }
    button { padding: 0.6rem 1rem; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>브라우저 실행 파일 다운로드</h1>
  <p>아래 버튼을 누르면 브라우저에서 바로 열 수 있는 HTML 파일을 다운로드합니다.</p>
  <button id="downloadBtn" type="button">실행 파일 다운로드</button>

  <script>
    const appHtml = `<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoteMeeting 실행 파일</title>
</head>
<body>
  <h1>VoteMeeting 실행 파일</h1>
  <p>다운로드가 정상 완료되었습니다. 이 파일은 브라우저에서 바로 실행됩니다.</p>
</body>
</html>`;

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const blob = new Blob([appHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = 'vote-meeting-run.html';
      anchor.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
