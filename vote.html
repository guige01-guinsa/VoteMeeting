<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아파트 의견수렴 자동 개표 시스템</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">Apartment Vote Meeting</p>
      <h1>아파트 의견수렴 자동 개표 시스템</h1>
      <p>PDF 의견수렴서를 선택하고 자동 분석·집계하기 위한 오프라인 업무 화면입니다.</p>
    </header>

    <section class="panel" aria-labelledby="file-title">
      <div class="panel-heading">
        <div>
          <p class="step">STEP 1</p>
          <h2 id="file-title">PDF 파일 선택</h2>
        </div>
        <span id="fileCount" class="badge">0개 선택</span>
      </div>
      <label class="file-picker" for="pdfFiles">
        <strong>PDF 선택</strong>
        <span>여러 파일을 한 번에 선택할 수 있습니다.</span>
      </label>
      <input id="pdfFiles" type="file" accept="application/pdf,.pdf" multiple>
      <div id="fileSummary" class="file-summary">선택된 파일이 없습니다.</div>
    </section>

    <section class="panel" aria-labelledby="analysis-title">
      <div class="panel-heading">
        <div>
          <p class="step">STEP 2</p>
          <h2 id="analysis-title">분석 및 집계</h2>
        </div>
        <button id="analyzeButton" class="primary-button" type="button" disabled>분석 시작</button>
      </div>

      <div class="progress-track" aria-label="분석 진행률">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <p id="statusText" class="status-text">PDF를 선택하면 분석을 시작할 수 있습니다.</p>

      <div class="stats-grid">
        <article><span>파일</span><strong id="statFiles">0</strong></article>
        <article><span>성공</span><strong id="statSuccess">0</strong></article>
        <article><span>오류</span><strong id="statErrors">0</strong></article>
        <article><span>중복</span><strong id="statDuplicates">0</strong></article>
        <article><span>찬성</span><strong id="statApprove">0</strong></article>
        <article><span>반대</span><strong id="statReject">0</strong></article>
      </div>
    </section>

    <section class="panel export-panel" aria-labelledby="export-title">
      <div>
        <p class="step">STEP 3</p>
        <h2 id="export-title">결과 저장</h2>
        <p>분석이 완료되면 CSV 파일로 결과를 저장합니다.</p>
      </div>
      <button id="saveButton" class="secondary-button" type="button" disabled>CSV 저장</button>
    </section>

    <footer>현재 단계: Commit 002 · 기본 화면</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
